<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f6f5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Aster</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
.quick{display:flex;gap:8px;padding:14px 2px 4px}
.quick input{flex:1;height:44px;border:0;border-radius:12px;background:#F4F2EC;color:#17181B;
  padding:0 14px;font-size:14px;outline:none}
.quick input:focus{background:#fff;box-shadow:0 0 0 1.5px #17181B inset}
.quick button{height:44px;padding:0 16px;border:0;border-radius:12px;background:#17181B;color:#fff;font-size:14px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --white:#FFFFFF;--shell:#FBFBFC;--ink:#0A0A0B;--ink-2:#6E6E73;--ink-3:#A9A9AF;
  --hair:#ECECF0;--pink:#FF2D55;
  --sans:"SF Pro Text",-apple-system,"PingFang SC",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
html{--vh:1vh}
body{display:flex;flex-direction:column;height:calc(var(--vh, 1vh) * 100);overflow:hidden;color:var(--ink);
  --safe-top:env(safe-area-inset-top, 0px);
  background:linear-gradient(180deg,#FDFBF6 0%,#F1ECE2 60%,#E7E1D5 100%) fixed;
  font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);
  position:relative}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(70px)}
body::before{width:300px;height:300px;left:-80px;top:-120px;background:rgba(194,36,60,.10)}
body::after{width:380px;height:380px;right:-150px;top:200px;background:rgba(120,112,98,.14)}
main,footer,header{position:relative;z-index:1}
#tabs{z-index:40}
/* 顶栏：无底色，只有一条极细的分隔 */
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:56px;
  padding:calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 8px) 20px 8px;
  background:rgba(251,250,246,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--hair);background:rgba(255,255,255,.9);backdrop-filter:blur(18px)}
#menu{display:none !important;width:40px;height:40px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center}
#menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.who{min-width:0;flex:1}
.who b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.who span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
#net{width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:10px}
#net.on{background:var(--pink)}
/* 主体 */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}
.pane.on{display:flex}
/* 对话：没有气泡，只有文字与留白 */
#log{flex:1;min-height:0;overflow:auto;padding:20px 18px 14px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
#log::-webkit-scrollbar{display:none}
.day{font-size:11.5px;color:#A8A59E;letter-spacing:.06em;display:flex;align-items:center;gap:12px;margin:26px 0 22px;font-size:11px;color:var(--ink-3)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--hair)}
.turn{display:flex;align-items:flex-start;gap:10px;margin:0 0 16px;width:100%}
.turn.her{justify-content:flex-start}
.turn.me{justify-content:flex-end}
.turn .av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#EFEDE8;margin-top:2px;
  background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.turn p{margin:0;font-size:15.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  padding:10px 14px;border-radius:16px;max-width:min(78%, 520px);text-align:left}
.turn.her p{background:#fff;border:1px solid #ECEAE4;border-bottom-left-radius:6px;color:#17181B}
.turn.me p{background:#16171A;border-bottom-right-radius:6px;color:#F5F3EE}
.turn.sys{display:block;width:100%;text-align:center;margin:10px 0 14px}
.turn.sys p{display:inline-block;padding:0;background:none;border:0;font-size:12px;color:#9a9aa1;text-align:center}
.turn .at{display:block;margin-top:6px;font-size:11px;color:#C4C4C9}
/* 输入 */
footer{flex:0 0 auto;padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--hair)}
.field{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;
  padding:7px 9px 7px 18px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 26px rgba(24,22,18,.07)}
.field input{flex:1;min-width:0;height:42px;border:0;background:none;outline:none;
  font-family:var(--sans);font-size:15px;color:var(--ink)}
.field input::placeholder{color:var(--ink-3)}
#pic{width:30px;height:30px;border:0;background:none;color:var(--ink-3);font-size:15px;line-height:1}
#assign{width:30px;height:30px;border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1}
#send2{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:0;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:14px}
#send2:active{opacity:.7}
/* 列表页 */
.list{flex:1;overflow:auto;padding:22px 22px calc(28px + env(safe-area-inset-bottom))}
.h{font-size:12px;font-weight:600;color:var(--ink-3);margin:24px 0 4px}
.h:first-child{margin-top:0}
.item{padding:14px 0;border-bottom:1px solid var(--hair)}
.item .t1{font-size:15px;line-height:1.6}
.item .t2{font-size:12px;color:var(--ink-3);margin-top:3px}
.empty{font-size:13.5px;color:var(--ink-3);padding:6px 0 14px;line-height:1.8}
.addbtn{width:100%;height:46px;border-radius:0;border:0;border-bottom:1px solid var(--hair);
  background:none;color:var(--ink);font-size:14px;text-align:left;padding:0 2px;margin-top:8px}
/* 侧边栏 */
#side{position:fixed;inset:0;background:rgba(10,10,11,.22);z-index:60;opacity:0;visibility:hidden;
  transition:opacity .26s ease, visibility .26s ease}
#side.on{opacity:1;visibility:visible}
#side .panel{transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,.7,.3,1)}
#side.on .panel{transform:none}
#side .panel{position:absolute;left:0;top:0;bottom:0;width:80%;max-width:320px;
  background:linear-gradient(165deg,#1B1B1F 0%,#101012 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:0 22px 22px 0;
  padding:calc(24px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:auto;border:0;outline:none}
#side .top{display:flex;align-items:center;gap:12px;padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.10)}
#side .top img,#side .top .ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#2A2A2E;
  display:grid;place-items:center;font-size:16px;color:var(--pink)}
#side .top b{display:block;font-size:15px;font-weight:600;color:#F5F3EE}
#side .top span{display:block;font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}
#side a{display:flex;align-items:center;gap:14px;height:50px;padding:0 22px;color:rgba(255,255,255,.72);
  font-size:14.5px;text-decoration:none}
#side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#side a.on{color:#F5F3EE;font-weight:600;position:relative}
#side a.on::before{content:'';position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:2px;background:#FF2D55}
#side a.on svg{stroke:var(--pink)}
#banner{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 8px);
  background:#17181B;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;
  box-shadow:0 16px 40px rgba(0,0,0,.28);z-index:70;opacity:0;transform:translateY(-8px);
  transition:opacity .3s ease,transform .3s ease;pointer-events:none}
#banner.on{opacity:1;transform:none}
#banner b{color:#fff}
#banner span{color:#B9B9C1}

.sec{padding:14px 2px 2px}
.sec .label{font-size:11px;letter-spacing:.18em;color:#8A8A92;margin:0 0 8px}
#pane-tools .empty{padding:10px 0;font-size:12.5px;color:#A9A7A0;text-align:left}
.hint2{font-size:12px;color:#8A8A92;line-height:1.8;padding:4px 2px}
.pend{border-top:1px solid var(--line,#EAE7E0);padding:12px 0}
.pend .t{font-size:14px}
.pend .w{font-size:12px;color:#8A8A92;margin-top:4px}
.pend .row{display:flex;gap:8px;margin-top:10px}
.pend button{height:34px;padding:0 14px;border-radius:10px;border:0;font-size:13px}
.pend .ok{background:#17181B;color:#fff}
.pend .no{background:#F4F2EC;color:#3A3A42}

/* —— 工具页 —— */
#pane-tools,#pane-trips,#pane-mem,#pane-me,#pane-settings{padding:0 22px 28px;overflow-y:auto;display:none;height:100%}
#pane-tools.on,#pane-trips.on,#pane-mem.on,#pane-me.on,#pane-settings.on{display:block}
#pane-chat.on{display:flex;flex-direction:column}
.ph{padding:16px 0 6px;display:flex;gap:14px;align-items:flex-start;height:auto}
.phText{flex:1;min-width:0}
.phFace{width:54px;height:54px;display:none;flex:0 0 54px;align-self:flex-start;margin-top:4px;
  border-radius:50%;object-fit:cover;object-position:center top;background:#F2F0EA;
  box-shadow:0 0 0 1px #EDEAE3, 0 6px 16px rgba(16,16,20,.08)}
.ph h1{margin:0 0 8px;font-size:30px;font-weight:600;letter-spacing:-.02em;color:#101014}
.ph p{margin:0;font-size:13px;color:#8C8A84;line-height:1.8}
.assign{display:flex;gap:8px;margin:20px 0 0}
.assign input{flex:1;height:46px;border:0;border-radius:12px;background:#F2F0EA;color:#101014;
  padding:0 14px;font-size:14.5px;outline:none;transition:background .15s,box-shadow .15s}
.assign input:focus{background:#fff;box-shadow:0 0 0 1.5px #101014 inset}
.assign button{height:46px;padding:0 18px;border:0;border-radius:12px;background:#101014;color:#fff;
  font-size:14px;font-weight:500}
.assign button[disabled]{opacity:.5}
.assignState{min-height:18px;padding:8px 2px 0;font-size:12px;color:#8C8A84}
.block{margin-top:16px;padding:16px 16px 6px;border-radius:20px;border:1px solid rgba(255,255,255,.75);
  background:rgba(255,255,255,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 10px 30px rgba(60,50,36,.08), 0 2px 6px rgba(60,50,36,.04)}
.block h2{margin:0 0 8px;font-size:12px;font-weight:600;color:#8C8A84;letter-spacing:.08em}
.block .count{margin-left:7px;color:#C2243C;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.block .row{border-bottom:1px solid rgba(16,16,20,.06);padding:0}
.block .row:first-child{border-top:0}
.block .row:last-child{border-bottom:0}
.rowMain{display:flex;align-items:baseline;gap:10px;padding:12px 0 4px}
.rowMain b{font-weight:500;font-size:15px;color:#101014;line-height:1.5;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowMain span{font-size:11.5px;color:#A8A59E;font-variant-numeric:tabular-nums}
.rowSub{padding:0 0 10px;font-size:12.5px;color:#6C6A64;line-height:1.7}
.rowActs{display:flex;gap:8px;padding:0 0 12px}
.rowActs button{height:34px;padding:0 15px;border-radius:10px;border:0;font-size:13px}
.rowActs .link{height:26px;padding:0;background:none;color:#A8A59E;font-size:12px}
.nowRow{display:grid;grid-template-columns:1fr 62px;gap:12px;align-items:center;
  padding:13px 0;border-bottom:1px solid rgba(16,16,20,.055)}
.nowRow:last-child{border-bottom:0}
.nowT{font-size:14.5px;color:#101014;line-height:1.45;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowT em{display:block;font-style:normal;font-size:11.5px;color:#A8A59E;
  margin-top:3px;white-space:normal;line-height:1.5}
.nowSide{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:62px}
.nowSide span{font-size:11.5px;color:#A8A59E}
.rt i{font-style:normal;font-size:11.5px;color:#A8A59E}
.pinkDel{border:0;border-radius:8px;background:rgba(194,36,60,.09);color:#C2243C;
  font-size:11.5px;line-height:1;padding:5px 9px;min-width:38px}
.pinkDel.okB{background:rgba(63,143,99,.10);color:#3F8F63}
.rowActs .link:active{color:#C2243C}
.rowActs .ok{background:#101014;color:#fff}
.rowActs .no{background:#F2F0EA;color:#4A4A52}
.empty2{padding:10px 0 4px;font-size:13px;color:#A8A59E;line-height:1.8}
.usage{display:flex;gap:26px;padding:6px 0 4px;font-variant-numeric:tabular-nums}
.usage div{display:flex;flex-direction:column;gap:2px}
.usage b{font-size:17px;font-weight:500;color:#101014}
.usage span{font-size:11px;color:#A5A29B}

/* —— 底部标签栏 —— */
#tabs{display:none}
#tabsX{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(251,250,246,.78);backdrop-filter:blur(20px);
  border-top:1px solid #EDEAE3}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 0 2px;color:#A8A59E;font-size:10.5px;letter-spacing:.02em;text-decoration:none}
#tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
#tabs a.on{color:#101014}
#tabs a.on svg{stroke-width:1.8}
body{padding-bottom:0}

.tl{padding:4px 0 0}
.tlDay{font-size:11.5px;color:#A8A59E;padding:10px 0 4px;letter-spacing:.04em}
.tlRow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(16,16,20,.055)}
.tlRow:last-child{border-bottom:0}
.tlTime{flex:0 0 38px;font-size:11.5px;color:#B3B0A8;font-variant-numeric:tabular-nums}
.tlBody{flex:1;min-width:0}
.tlTitle{font-size:14.5px;color:#101014;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlMeta{font-size:11.5px;color:#A8A59E;margin-top:2px}
.tlTag{font-size:10.5px;color:#C2243C}
.meHead{display:flex;gap:14px;align-items:center;padding:18px 0 6px}
.meHead img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:center top;
  background:#F2F0EA;box-shadow:0 0 0 1px #EDEAE3}
.meHead b{display:block;font-size:19px;font-weight:600;color:#101014;letter-spacing:-.01em}
.meHead span{display:block;font-size:12.5px;color:#A8A59E;margin-top:3px}
#emptyChat{flex:1;min-height:0;padding:30px 6px 0;overflow:auto}
#emptyChat .ec1{margin:0 0 8px;font-size:19px;font-weight:600;color:#101014;letter-spacing:-.01em}
#emptyChat .ec2{margin:0 0 22px;font-size:13px;color:#A8A59E;line-height:1.9}
#emptyChat .ecChips{display:flex;flex-wrap:wrap;gap:8px}
#emptyChat .ecChips span{font-size:12.5px;color:#C2243C;background:rgba(194,36,60,.075);
  border-radius:999px;padding:8px 14px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
#emptyChat .ecChips span:active{background:rgba(194,36,60,.14)}
.sw{flex:0 0 40px;height:24px;border-radius:12px;background:#E6E3DB;position:relative;transition:background .18s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw.on{background:#101014}
.sw.on i{transform:translateX(16px)}
.chev{color:#C9C6BE;font-size:16px;padding-left:8px}
.setRow,.goRow,.tlRow{cursor:pointer}
.setRow:active,.goRow:active{background:#FBFAF7}
.tile{flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:rgba(194,36,60,.07);margin-top:2px}
.tile svg{width:17px;height:17px;fill:none;stroke:#C2243C;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.caps{padding:4px 0 2px}
.capRow{display:grid;grid-template-columns:30px 52px 1fr;gap:10px;padding:11px 0;
  border-bottom:1px solid rgba(16,16,20,.055);cursor:pointer;align-items:baseline}
.capRow:last-child{border-bottom:0}
.capRow:active{background:rgba(16,16,20,.02)}
.capK{font-size:13.5px;font-weight:600;color:#101014;align-self:center}
.capD{font-size:12.5px;color:#6C6A64;line-height:1.7;align-self:center}
.capD em{display:block;font-style:normal;color:#A8A59E;margin-top:2px;font-size:11.5px}
.block.dark{background:linear-gradient(160deg,#1B1B1F 0%,#121214 100%);
  border-color:rgba(255,255,255,.07);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 12px 30px rgba(20,18,16,.18)}
.block.dark h2{color:rgba(255,255,255,.52)}
.block.dark .count{color:#FF5C77}
.block.dark .capRow{border-bottom-color:rgba(255,255,255,.08)}
.block.dark .capRow:active{background:rgba(255,255,255,.04)}
.block.dark .capK{color:#F5F3EE}
.block.dark .capD{color:rgba(255,255,255,.62)}
.block.dark .capD em{color:rgba(255,255,255,.40)}
.block.dark .usage b{color:#F5F3EE}
.block.dark .usage span{color:rgba(255,255,255,.45)}

/* —— 聊天页用绝对定位兜底：不依赖 flex 撑高 —— */
#pane-chat.on{display:block;position:relative;height:100%}
#pane-chat #log{position:absolute;left:0;right:0;top:0;bottom:88px;overflow-y:auto;
  padding:18px 22px 10px;flex:none;height:auto}
#pane-chat #emptyChat{position:absolute;left:0;right:0;top:0;bottom:88px;overflow-y:auto;
  padding:26px 24px 10px;flex:none}
#pane-chat footer{position:absolute;left:0;right:0;bottom:0;flex:none}
/* 只有对话页需要顶部那条状态；其他页各自有标题 */
body.nohead header{background:transparent;border-bottom:0;min-height:0;
  padding-bottom:0}
body.nohead header .who{display:none}
body.nohead main{padding-top:calc(12px + env(safe-area-inset-top))}
#fabMenu{outline:none;flex:0 0 26px;width:26px;height:34px;border:0;border-radius:0;
  background:transparent;box-shadow:none;display:grid;place-items:center;padding:0;margin-right:8px}
#fabMenu svg{width:20px;height:20px;stroke:#101014;fill:none;stroke-width:1.8;stroke-linecap:round}
body.nohead #fabMenu{width:26px;height:34px;flex:none;background:transparent}
body{padding-top:0}
body.nohead main{padding-top:0}
.picB{padding:4px!important;background:#fff;border:1px solid #ECEAE4;border-radius:14px;overflow:hidden}
.picB img{display:block;max-width:180px;max-height:240px;border-radius:10px}
.turn.me .picB{background:#16171A;border-color:transparent}
#sheet{position:fixed;inset:0;z-index:80;background:rgba(10,10,11,.28);
  opacity:0;visibility:hidden;transition:opacity .22s}
#sheet.on{opacity:1;visibility:visible}
#sheet .sheetBox{position:absolute;left:0;right:0;bottom:0;max-height:78%;
  background:#FBFAF6;border-radius:22px 22px 0 0;padding:18px 22px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.7,.3,1);overflow:auto}
#sheet.on .sheetBox{transform:none}
#sheet .sheetHd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#sheet .sheetHd b{font-size:15px}
#sheet .sheetX{font-size:12.5px;color:#8C8A84}
#sheet .sheetBody{font-size:13px;line-height:1.8;color:#4A4A52}
body{font-size:calc(15px * var(--fs, 1))}
.askBox{position:fixed;inset:0;z-index:90;background:rgba(10,10,11,.30);display:flex;

<script>
(function(){
  const sync = () => { try { if (window.AsterBars && window.AsterBars.apply) window.AsterBars.apply('light'); } catch(e){} };
  sync(); setTimeout(sync, 500); setTimeout(sync, 1500);
})();

const T = new URLSearchParams(location.search).get('t') || '';
const $ = (s) => document.querySelector(s);
const api = (u, o) => fetch(u, Object.assign({headers: {'X-Pair': T, 'Content-Type': 'application/json'}}, o || {}));

/* ---------- 对话 ---------- */
let FACE_SRC = '';
function hideEmpty(){ const e = document.getElementById('emptyChat'); if (e) e.style.display = 'none'; }
function initEmpty(){
  const e = document.getElementById('emptyChat');
  if (!e) return;
  e.querySelectorAll('.ecChips span').forEach(sp => sp.onclick = () => {
    const t = document.getElementById('t'); if (!t) return;
    t.value = sp.textContent; t.focus();
  });
}
function addImg(src, who){
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + (who === 'me' ? 'me' : 'her');
  hideEmpty();
  const p = document.createElement('p');
  p.className = 'picB';
  const im = document.createElement('img');
  im.src = src;
  im.onload = () => { const L = $('#log'); if (L) L.scrollTop = L.scrollHeight; };
  p.appendChild(im);
  wrap.appendChild(p);
  const L = $('#log'); L.appendChild(wrap); L.scrollTop = L.scrollHeight;
  return wrap;
}

function add(text, who){
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + (who === 'me' ? 'me' : who === 'sys' ? 'sys' : 'her');
  if (!who || who === 'her') {
    const av = document.createElement('div');
    av.className = 'av';
    if (FACE_SRC) av.style.backgroundImage = 'url(' + FACE_SRC + ')';
    else av.style.display = 'none';
    wrap.appendChild(av);
  }
  hideEmpty();
  const p = document.createElement('p'); p.textContent = text;
  wrap.appendChild(p);
  const L = $('#log'); L.appendChild(wrap); L.scrollTop = L.scrollHeight;
}
function snGet(){ try { return JSON.parse(localStorage.getItem('aster.snap') || 'null'); } catch(e){ return null; } }
async function snapshot(){
  try { const r = await api('/sync/snapshot'); const d = await r.json();
    if (d && d.ok) localStorage.setItem('aster.snap', JSON.stringify(d)); } catch(e){}
}
function grams(q){ const c=(q||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,''); const g=[];
  for(let i=0;i<c.length-1;i++) g.push(c.slice(i,i+2)); return g; }
function topMems(q, n){
  const snap = snGet(); if (!snap) return [];
  const mems = snap.memories || [], gs = grams(q), df = {};
  gs.forEach(g => df[g] = 0);
  mems.forEach(m => { const t=String(m.text||''); gs.forEach(g=>{ if(t.indexOf(g)>=0) df[g]++; }); });
  const scored = mems.map(m => { const t=String(m.text||''); let s=0;
    gs.forEach(g=>{ if(t.indexOf(g)>=0) s += 1/(1+df[g]); }); return {t, s}; });
  scored.sort((a,b)=>b.s-a.s);
  return scored.slice(0,n).filter(x=>x.s>0).map(x=>x.t);
}
function offlineReply(q){
  const top = topMems(q, 1);
  if (top.length) return '我记得你说过：' + top[0].replace(/^他说的：/,'').replace(/^我说：/,'').slice(0,60);
  return '现在连不上家里那台电脑，先记下了，回去再说。';
}
async function cloudReply(q){
  const key = localStorage.getItem('aster.key') || ''; if (!key) return '';
  const snap = snGet() || {};
  const sys = '你是' + ((snap.identity && snap.identity.assistant) || 'Ta') + '。' + (snap.persona || '') +
    '\n你们的关系：' + ((snap.relation && snap.relation.tier_name) || '') + '。' +
    (topMems(q,8).length ? ('\n你记得他说过：\n' + topMems(q,8).map(t=>'· '+t).join('\n')) : '') +
    '\n短句、口语，一次一两句；不列点；不解释自己是 AI。';
  try {
    const r = await fetch('https://api.deepseek.com/v1/chat/completions', {method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({model:'deepseek-chat', messages:[{role:'system',content:sys},{role:'user',content:q}],
        max_tokens:120, temperature:0.8})});
    const d = await r.json();
    return String((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '').trim();
  } catch(e){ return ''; }
}
function qget(){ try { return JSON.parse(localStorage.getItem('aster.queue') || '[]'); } catch(e){ return []; } }
function qset(a){ try { localStorage.setItem('aster.queue', JSON.stringify(a.slice(-200))); } catch(e){} }
function qadd(t){ const a=qget(); a.push({ts:Math.floor(Date.now()/1000), text:t, kind:'chat'}); qset(a);
  add('已暂存，联网后自动上传', 'sys'); book(); }
async function flush(){
  const a = qget(); if (!a.length) return;
  try {
    const r = await api('/sync/ingest', {method:'POST', body: JSON.stringify({items: a})});
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.ok) { qset([]); add('已上传 ' + a.length + ' 条', 'sys'); book(); }
  } catch(e){}
}
async function send(){
  const i = $('#t'), v = (i.value || '').trim(); if (!v) return;
  i.value = ''; add(v, 'me');
  try {
    const r = await api('/chat', {method:'POST', body: JSON.stringify({text: v, channel: 'phone'})});
    const d = await r.json();
    if (d && d.ok) { add(d.reply || '…', 'her'); book(); }
    else throw new Error('bad');
  } catch(e) {
    let t = ''; try { t = await cloudReply(v); } catch(_){}
    add(t || offlineReply(v), 'her'); qadd(v); boot();
  }
}

/* 发图：上传到电脑，Ta看过之后回一句 */
/* 发图：先出缩略图，再等识别；原生壳里走系统相册 */
async function sendPic(data, name){
  const isImg = String(data || '').indexOf('data:image') === 0;
  if (isImg) addImg(data, 'me');
  else add('（发了个文件：' + (name || '文件') + '）', 'me');

  const wait = document.createElement('div');
  wait.className = 'turn her';
  const wp = document.createElement('p');
  wp.textContent = '让我看看…';
  wait.appendChild(wp);
  const L0 = $('#log'); L0.appendChild(wait); L0.scrollTop = L0.scrollHeight;

  const slow = setTimeout(() => { wp.textContent = '还在看，图有点大…'; }, 8000);
  const ctl = new AbortController();
  const killer = setTimeout(() => ctl.abort(), 95000);
  let d = null;
  try {
    const r = await fetch('/upload', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Pair': T},
      body: JSON.stringify({name: name || 'photo.jpg', data}),
      signal: ctl.signal
    });
    d = await r.json();
  } catch (e) { d = null; }
  clearTimeout(slow); clearTimeout(killer);
  if (wait.parentNode) wait.parentNode.removeChild(wait);

  if (d && d.ok && d.text) add(String(d.text).slice(0, 600), 'her');
  else if (d && d.ok) add('我打开看过了，但读不出内容。换个清楚点的图？', 'her');
  else add('这次没读到，可能是网络断了。再发一次试试？', 'her');
}

const picBtn = document.getElementById('pic');
if (picBtn) picBtn.onclick = async () => {
  try {
    if (window.AsterNative && window.AsterNative.pickImage) {
      const data = await window.AsterNative.pickImage();
      if (data && String(data).indexOf('data:') === 0) { await sendPic(String(data), '照片'); return; }
      if (data === '') return;
    }
  } catch (e) {}
  const i = document.createElement('input'); i.type = 'file';
  i.accept = 'image/*,application/pdf,.docx,.doc,.xlsx,.xls,.txt,.md,.csv,.json';
  i.onchange = async () => {
    const f = i.files && i.files[0];
    if (!f) return;
    const data = await new Promise((res) => {
      const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.readAsDataURL(f);
    });
    await sendPic(data, f.name);
  };
  i.click();
};

$('#send2').onclick = send;
$('#t').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#assign').onclick = async () => {
  const v = ($('#t').value || '').trim();
  if (!v) { add('先在输入框里写下要Ta做什么', 'sys'); return; }
  add('交给Ta了，正在电脑上做…', 'sys');
  let r = await api('/task/plan', {method:'POST', body: JSON.stringify({goal: v})}).then(x=>x.json()).catch(()=>null);
  if (!r || !r.ok) {
    r = await api('/task/add', {method:'POST', body: JSON.stringify({goal: v})}).then(x=>x.json()).catch(()=>null);
  }
  if (r && r.ok) { $('#t').value=''; add('已经开工：' + v + (r.steps ? '（' + r.steps + ' 步）' : ''), 'sys'); book(); }
  else add('没交上，稍后再试', 'sys');
};

/* ---------- 面板 ---------- */
let P = 'chat';
function openSide(open){ $('#side').classList.toggle('on', open !== false); }
$('#fabMenu').onclick = () => openSide();
$('#side').addEventListener('click', (e) => { if (e.target.id === 'side') openSide(false); });
// 在抽屉里往左滑就关上
let _dx0 = null, _dy0 = null, _aside = false;
document.addEventListener('touchstart', (e) => {
  const side = document.getElementById('side');
  _aside = !!(side && side.classList.contains('on') && side.contains(e.target) && e.target.closest('.panel'));
  const t = e.touches[0]; _dx0 = t.clientX; _dy0 = t.clientY;
}, {passive: true});
document.addEventListener('touchend', (e) => {
  if (_aside && _dx0 !== null) {
    const t = e.changedTouches[0];
    const dx = t.clientX - _dx0, dy = Math.abs(t.clientY - _dy0);
    if (dx < -45 && dy < 70) openSide(false);
  }
  _aside = false; _dx0 = null;
}, {passive: true});

// 从屏幕左缘往右滑也能拉出抽屉
let _tx0 = null, _ty0 = null;
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0]; _tx0 = t.clientX; _ty0 = t.clientY;
}, {passive: true});
document.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  if (_tx0 !== null && _tx0 < 26 && t.clientX - _tx0 > 60 && Math.abs(t.clientY - _ty0) < 60) openSide(true);
  _tx0 = null;
}, {passive: true});
function go(p){
  P = p;
  document.body.classList.toggle('nohead', P !== 'chat');
  document.querySelectorAll('#tabs a[data-p], #side a[data-p]').forEach(x => x.classList.toggle('on', x.dataset.p === P));
  document.querySelectorAll('.pane').forEach(el => el.classList.toggle('on', el.id === 'pane-' + P));
  openSide(false);
  if (P === 'trips') { trips(); setTimeout(quickNote, 0); }
  if (P === 'tools') toolsPage();
  if (P === 'mem') mems();
  if (P === 'me') { me(); setTimeout(() => { wireMeFace(); wireRows('#meList'); }, 80); }
  if (P === 'settings') settingsPage();
}
document.querySelectorAll('#tabs a[data-p], #side a[data-p]').forEach(a => a.onclick = () => go(a.dataset.p));
async function trips(){
  const d = await api('/trips').then(x=>x.json()).catch(()=>null);
  const its = (d && d.items || []).filter(x => !x.ended);
  const box = $('#tripList');
  box.innerHTML = its.length ? ('<div class="block"><h2>接下来<span class="count">' + its.length + '</span></h2>' +
    '<div class="tl">' + its.map(x =>
      '<div class="tlRow"><div class="tlTime">' + (x.when || '') + '</div>' +
      '<div class="tlBody"><div class="tlTitle">' + (x.what || '') + '</div>' +
      '<div class="tlMeta">' + (x.kind === 'meeting' ? '会议' : x.kind === 'trip' ? '出行' : '待办') + '</div></div>' +
      '<button class="miniDel" data-trip="' + x.id + '">删除</button></div>'
    ).join('') + '</div></div>')
    : '<div class="block"><div class="empty2">还没有安排。上面说一句，例如「明天下午三点跟设计对接口」。</div></div>';
  box.querySelectorAll('[data-trip]').forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    const ok = await askBox('删掉这条安排', '只删这条记录，改天再记就行。', '', '删掉', true);
    if (!ok) return;
    await api('/trip/del', {method:'POST', body: JSON.stringify({id: b.dataset.trip})}).then(r=>r.json()).catch(()=>null);
    trips();
  });
}

function quickNote(){
  const form = $('#qnForm'), st = $('#qnState');
  if (!form || form.dataset.bound) return;
  form.dataset.bound = '1';
  form.onsubmit = async (e) => {
    e.preventDefault();
    const inp = $('#qnInput'), btn = $('#qnBtn');
    const t = (inp.value || '').trim();
    if (!t) return;
    btn.disabled = true; btn.textContent = '记…';
    const r = await api('/quick/note', {method:'POST', body: JSON.stringify({text: t})})
      .then(x => x.json()).catch(() => null);
    btn.disabled = false; btn.textContent = '记下';
    if (r && r.ok) {
      inp.value = '';
      const it = r.item || {};
      st.textContent = '记下了：' + (it.what || '') + (it.when ? ' · ' + it.when : '');
      trips();
    } else {
      st.textContent = '没记上，再说一次？';
    }
  };
}


/* 头像：手机换了电脑端跟着换；电脑端换了这里切回来自动刷新 */
function wireMeFace(){
  const img = document.getElementById('meFace');
  if (!img || img.dataset.bound) return;
  img.dataset.bound = '1';
  img.onclick = async () => {
    const up = async (data) => {
      if (!data) return;
      img.style.opacity = .5;
      const r = await api('/avatar', {method:'POST', body: JSON.stringify({data})})
        .then(x => x.json()).catch(() => null);
      img.style.opacity = 1;
      if (r && r.ok) {
        img.src = '/img?f=' + encodeURIComponent(r.path) + '&t=' + Date.now();
        FACE_SRC = img.src;
        add('头像换了', 'sys');
      } else {
        add('头像没传上去，再试一次？', 'her');
      }
    };
    try {
      if (window.AsterNative && window.AsterNative.pickImage) {
        const d = await window.AsterNative.pickImage();
        if (d && String(d).indexOf('data:') === 0) { await up(String(d)); return; }
        if (d === '') return;
      }
    } catch (e) {}
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.style.display = 'none';
    document.body.appendChild(i);
    i.onchange = () => {
      const f = i.files && i.files[0];
      if (!f) { i.remove(); return; }
      const rd = new FileReader();
      rd.onload = () => { up(String(rd.result || '')).then(() => i.remove()); };
      rd.readAsDataURL(f);
    };
    i.click();
  };
}

async function refreshFace(){
  const f = await api('/face').then(x => x.json()).catch(() => null);
  if (!f || !f.path) return;
  const src = '/img?f=' + encodeURIComponent(f.path) + '&t=' + Date.now();
  FACE_SRC = src;
  const me = document.getElementById('meFace');
  if (me) me.src = src;
  document.querySelectorAll('#log .av').forEach(a => a.style.backgroundImage = 'url(' + src + ')');
  const tf = document.getElementById('toolFace');
  if (tf) tf.src = src;
}

  return '<div class="tlRow setRow" data-key="' + key + '"><div class="tlBody">' +
    '<div class="tlTitle">' + title + '</div><div class="tlMeta">' + sub + '</div></div>' +

}
const THEME_LABEL = { auto: '跟随系统', light: '浅色', dark: '深色' };

function applyTheme(){
  const t = localStorage.getItem('aster.theme') || 'auto';
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
  try {
    const bars = dark ? 'dark' : 'light';
    if (window.AsterBars && window.AsterBars.apply) window.AsterBars.apply(bars);
    else if (window.AsterNative && window.AsterNative.apply) window.AsterNative.apply(bars);
  } catch (e) {}
}

function rowAct(title, sub, key){
  return '<div class="tlRow actRow" data-act="' + key + '"><div class="tlBody">' +
    '<div class="tlTitle">' + title + '</div><div class="tlMeta">' + sub + '</div></div>' +
    '<span class="chev">›</span></div>';
}
function rowGo(title, sub, url){
  return '<div class="tlRow' + (url ? ' goRow' : '') + '"' + (url ? ' data-url="' + url + '"' : '') + '>' +
    '<div class="tlBody"><div class="tlTitle">' + title + '</div><div class="tlMeta">' + sub + '</div></div>' +
    (url ? '<span class="chev">›</span>' : '') + '</div>';
}
function askBox(title, sub, extra, okLabel, danger){
  const old = document.getElementById('askBox');
  if (old) old.remove();
  const box = document.createElement('div');
  box.id = 'askBox';
  box.className = 'askBox';
  box.innerHTML = '<div class="askIn">' +
    '<div class="askT">' + title + '</div>' +
    '<div class="askS">' + sub + '</div>' +
    (extra || '') +
    '<div class="askBtns">' +
      '<button class="askNo">取消</button>' +
      '<button class="askYes' + (danger ? ' red' : '') + '">' + okLabel + '</button>' +
    '</div></div>';
  document.body.appendChild(box);
  requestAnimationFrame(() => box.classList.add('on'));
  return new Promise((res) => {
    const close = (v) => { box.remove(); res(v); };
    box.querySelector('.askNo').onclick = () => close(false);
    box.querySelector('.askYes').onclick = () => close(true);
    box.addEventListener('click', (e) => { if (e.target === box) close(false); });
  });
}

function wireRows(scope){
  document.querySelectorAll(scope + ' .setRow').forEach(r => {
    if (r.dataset.bound) return;
    r.dataset.bound = '1';
    r.onclick = () => {
      const sw = r.querySelector('.sw');
      const on = !sw.classList.contains('on');
      sw.classList.toggle('on', on);
      localStorage.setItem('aster.' + r.dataset.key, on ? '1' : '0');
      if (r.dataset.key === 'notify') {
        add(on ? '通知开着' : '通知关了', 'sys');
        if (on) {
          try {
            if (window.AsterNative && window.AsterNative.notify) {
              window.AsterNative.notify('通知已打开', '到点提醒会出现在这里。');
            }
          } catch (e) {}
        }
      }
    };
  });
  document.querySelectorAll(scope + ' .actRow').forEach(r => {
    if (r.dataset.bound) return;
    r.dataset.bound = '1';
    r.onclick = () => {
      const k = r.dataset.act;
      if (k === 'theme') {
        openSheet('外观', '');
        const sh = document.getElementById('sheet');
        const cur = localStorage.getItem('aster.theme') || 'auto';
        sh.querySelector('.sheetBody').innerHTML = ['auto', 'light', 'dark'].map(v =>
          '<div class="thRow" data-v="' + v + '" style="display:flex;justify-content:space-between;align-items:center;' +
          'padding:13px 0;border-bottom:1px solid rgba(16,16,20,.06)"><span>' + THEME_LABEL[v] + '</span>' +
          '<span style="color:#C2243C">' + (cur === v ? '✓' : '') + '</span></div>').join('') +
          '<p style="margin-top:12px;color:#8C8A84;font-size:12px">跟随系统：手机切到深色时，Aster 自动变深。</p>';
        sh.querySelectorAll('.thRow').forEach(r => r.onclick = () => {
          localStorage.setItem('aster.theme', r.dataset.v);
          applyTheme(); sh.classList.remove('on'); me();
        });
      }
      else if (k === 'role') roleSheet();
      else if (k === 'device') deviceSheet();
      else if (k === 'export') {
        const base = location.origin;
        const url = base + '/memory/pack.zip?t=' + encodeURIComponent(T);
        openSheet('导出记忆', '<p>会把记忆、对话、性格打成一个压缩包，下载到手机。</p>' +
          '<p style="margin-top:12px"><a href="' + url + '" target="_blank" ' +
          'style="display:inline-block;background:#101014;color:#fff;border-radius:12px;padding:10px 16px;text-decoration:none">开始导出</a></p>' +
          '<p style="margin-top:10px;color:#8C8A84;font-size:12px">若没有自动下载，长按上面的按钮复制链接。</p>');
      }
      else if (k === 'contact') contactSheet();
      else if (k === 'site') openSite();
      else if (k === 'privacy') openSheet('隐私政策', PRIVACY_TEXT);
      else if (k === 'about') openSheet('关于 Aster', ABOUT_TEXT + ABOUT_URL_LINE);
      else if (k === 'cache') {
        if (confirm('清掉页面缓存？记忆和对话不会动。')) {
          try { localStorage.removeItem('aster.api'); } catch (e) {}
          location.reload();
        }
      } else if (k === 'font') {
        const cur = localStorage.getItem('aster.font') || 'm';
        const next = cur === 'm' ? 'l' : cur === 'l' ? 's' : 'm';
        localStorage.setItem('aster.font', next);
        applyFont();
        openSheet('字号', '<p>已切到' + (next === 's' ? '小' : next === 'l' ? '大' : '标准') + '。再点一次「字号」继续切换。</p>');
      }
    };
  });
  document.querySelectorAll(scope + ' .goRow').forEach(r => {
    if (r.dataset.bound) return;
    r.dataset.bound = '1';
    r.onclick = () => { if (r.dataset.url) window.open(r.dataset.url, '_blank'); };
  });
  const un = document.getElementById('unpairRow');
  if (un && !un.dataset.bound) {
    un.dataset.bound = '1';
    un.onclick = () => {
      if (!confirm('断开后这台手机要重新扫码才能连上，确定？')) return;
      localStorage.removeItem('aster.base'); localStorage.removeItem('aster.token');
      location.reload();
    };
  }
}

async function toolsPage(){
  const form = $('#assignForm'), st = $('#toolState');
  if (form && !form.dataset.bound) {
    form.dataset.bound = '1';
    form.onsubmit = async (e) => {
      e.preventDefault();
      const goal = $('#toolGoal'), btn = $('#toolSend');
      const v = (goal.value || '').trim();
      if (!v) return;
      btn.disabled = true; btn.textContent = '已交';
      let r = await api('/task/plan', {method:'POST', body: JSON.stringify({goal: v})})
        .then(x => x.json()).catch(() => null);
      if (!r || !r.ok) {
        r = await api('/task/add', {method:'POST', body: JSON.stringify({goal: v})})
          .then(x => x.json()).catch(() => null);
      }
      btn.disabled = false; btn.textContent = '交给她';
      if (r && r.ok) {
        goal.value = '';
        st.textContent = (r.steps ? r.steps + ' 步，已开工' : '已记下，等Ta开始');
        setTimeout(toolsPage, 1200);
      } else {
        st.textContent = '没交上，稍后再试';
      }
    };
  }

  paintCaps();
  await paintNow();
  const its = [];

  const al = $('#actList'), ac = $('#actCount');
  const av = await api('/activity?limit=30').then(x => x.json()).catch(() => null);
  const acts = ((av && av.items) || []).slice(0, 8);
  if (ac) ac.textContent = acts.length ? String(acts.length) : '';
  if (acts.length) {
    let lastDay = '';
    al.innerHTML = acts.map(x => {
      let head = '';
      if (x.day !== lastDay) { lastDay = x.day; head = '<div class="tlDay">' + x.day + '</div>'; }
      return head + '<div class="tlRow">' +
        '<div class="tile">' + (ICON[x.kind] || ICON.default) + '</div>' +
        '<div class="tlBody"><div class="tlTitle">' + (x.title || '') + '</div>' +
        '<div class="tlMeta">' + (x.label || '') + ' · ' + (x.time || '') + '</div></div></div>';
    }).join('');
  } else {
    al.innerHTML = '<div class="empty2">还没有做过什么。第一件事，可以是整理今天的日程。</div>';
  }

  const face = $('#toolFace');
  if (face) {
    let nm = 'think';
    if (its.length) nm = 'peek';
    const tl = await api('/task/list').then(x => x.json()).catch(() => null);
    if (((tl || {}).items || []).some(t => t.status === 'running')) nm = 'music';
    const f = await api('/preset?name=' + nm).then(x => x.json()).catch(() => null);
    if (f && f.ok) { face.src = '/img?f=' + encodeURIComponent(f.path); face.style.display = 'block'; }
  }

  const ub = $('#usageBox');
  const uu = await api('/usage').then(x => x.json()).catch(() => null);
  ub.innerHTML = uu ? (
    '<div><b>¥' + Number(uu.cost || 0).toFixed(2) + '</b><span>今日</span></div>' +
    '<div><b>¥' + Number(uu.cost_week || 0).toFixed(2) + '</b><span>近七日</span></div>' +
    '<div><b>' + (uu.calls || 0) + '</b><span>调用</span></div>') : '—';
}

function fmtAgo(ts){
  const t = Number(ts) || 0;
  if (!t) return '';
  const s0 = Math.max(0, Math.floor(Date.now() / 1000) - (t > 1e12 ? Math.floor(t / 1000) : t));
  if (s0 < 60) return '刚刚';
  if (s0 < 3600) return Math.floor(s0 / 60) + ' 分钟前';
  if (s0 < 86400) return Math.floor(s0 / 3600) + ' 小时前';
  return Math.floor(s0 / 86400) + ' 天前';
}

/* ---------- 启动 ---------- */
let _notifySince = Math.floor(Date.now() / 1000) - 60;
let _notifyTimer = null;
function showBanner(title, sub){
  const el = document.getElementById('banner');
  if (!el) return;
  el.innerHTML = '<b>' + title + '</b>' + (sub ? '<br><span>' + sub + '</span>' : '');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 6000);
}
async function pollNotify(){
  const t = Math.floor(Date.now() / 1000) - 90;
  const d = await api('/notify/pending?since=' + _notifySince).then(x => x.json()).catch(() => null);
  _notifySince = t;
  const its = (d && d.items) || [];
  if (!its.length) return;
  const it = its[0];
  showBanner('到点了：' + (it.what || ''), it.when || '');
  try {
    if (window.AsterNative && window.AsterNative.notify) {
      window.AsterNative.notify('到点了：' + (it.what || ''), it.when || '');
    }
  } catch (e) {}
  add('到点了：' + (it.what || '') + (it.when ? ' · ' + it.when : ''), 'her');
}
function startNotify(){
  if (_notifyTimer) return;
  _notifyTimer = setInterval(pollNotify, 60000);
  setTimeout(pollNotify, 4000);
}


/* 实时：电脑端换了头像、有新待批、提醒到点，这里立刻知道 */
let _es = null;
function startEvents(){
  if (_es || !window.EventSource) return;
  try {
    _es = new EventSource('/events?t=' + encodeURIComponent(T));
    _es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.face) {
          const src = '/img?f=' + encodeURIComponent(d.face) + '&t=' + Date.now();
          FACE_SRC = src;
          const me = document.getElementById('meFace'); if (me) me.src = src;
          const tf = document.getElementById('toolFace'); if (tf) tf.src = src;
          document.querySelectorAll('#log .av').forEach(a => a.style.backgroundImage = 'url(' + src + ')');
        }
        if (d.pend && P === 'tools') toolsPage();
        if (d.due && d.due.length) {
          const w = d.due[0];
          showBanner('到点了：' + w, '');
          add('到点了：' + w, 'her');
        }
      } catch (e) {}
    };
    _es.onerror = () => { try { _es.close(); } catch (e) {} _es = null; setTimeout(startEvents, 4000); };
  } catch (e) {}
}


/* 真实视口高度：WebView 里 vh/dvh 都不可靠，用 innerHeight 量出来 */
function applyFont(){
  const f = localStorage.getItem('aster.font') || 'm';
  document.documentElement.style.setProperty('--fs', f === 'l' ? '1.08' : f === 's' ? '0.94' : '1');
}
function setSafeTop(){
  // env(safe-area-inset-top) 在 WebView 里经常是 0；原生壳里手动补一条
  const v = parseFloat(getComputedStyle(document.body).getPropertyValue('--safe-top')) || 0;
  const native = window.__ASTER_NATIVE === 'harmony' || typeof window.AsterNative !== 'undefined';
  if (v < 8) document.body.style.setProperty('--safe-top', (native ? 30 : 0) + 'px');
}
function setVH(){
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  if (h > 120) document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
}
setVH(); setSafeTop(); applyFont(); applyTheme();
window.addEventListener('resize', setVH);
if (window.matchMedia) {
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme()); } catch (e) {}
}
window.addEventListener('orientationchange', setVH);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setVH);
document.addEventListener('visibilitychange', () => { if (!document.hidden) setVH(); });

let POCKET = null, POCKET_TS = 0;
async function pocketState(force){
  const now = Date.now();
  if (!force && POCKET && now - POCKET_TS < 60000) return POCKET;
  const d = await api('/pocket/state').then(x => x.json()).catch(() => null);
  if (d && d.ok) { POCKET = d; POCKET_TS = now; }
  return POCKET;
}

async function boot(){
  initEmpty();
  document.body.classList.toggle('nohead', P !== 'chat');
  setVH();
  startEvents();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFace(); });
  setInterval(refreshFace, 60000);
  startNotify();
  try {
    const h = await api('/history').then(x=>x.json());
    const its = (h && h.items || []).slice(-30);
    const L = $('#log');
    if (its.length) hideEmpty();
    if (!L.dataset.filled && its.length) {
      L.innerHTML = '<div class="day">' + dayLabel() + '</div>'; L.dataset.filled = '1';
      its.forEach(m => add(m.text || '', m.who === 'me' ? 'me' : 'her'));
    }
  } catch(e){}
  try {
    const id = await api('/identity').then(x=>x.json());
    $('#nm').textContent = id.assistant || 'Aster';
  } catch(e){}
  try {
    const f = await api('/face').then(x=>x.json());
    const nm = $('#nm').textContent || 'A';
    if (f.path) { FACE_SRC = '/img?f=' + encodeURIComponent(f.path);
      // 历史先渲染完了，这里把已经画出来的头像补上图
      document.querySelectorAll('#log .av').forEach(function(a){ a.style.backgroundImage = 'url(' + FACE_SRC + ')'; });
      const im = $('#av'); if (im) im.src = FACE_SRC;
      const i2 = $('#av2'); i2.style.display='block'; i2.src = '/img?f=' + encodeURIComponent(f.path); $('#avph').style.display='none'; }
    else { $('#avph').textContent = nm.slice(0,1); }
    $('#nm2').textContent = nm;
  } catch(e){}
  try {
    const m = await api('/mood').then(x=>x.json());
    if (m.mood) { $('#st').textContent = m.mood; $('#st2').textContent = m.mood; }
  } catch(e){}
  setNet('在线', true);
  book();
}
function setNet(txt, on){ const n=$('#net'); if(!n) return; n.classList.toggle('on', !!on); n.title = txt; }
window.addEventListener('online', () => { setNet('在线', true); flush(); });
window.addEventListener('offline', () => { setNet('离线', false); });
function dayLabel(){ const d=new Date();
  return (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日'; }
boot(); snapshot();
setInterval(flush, 20000);
