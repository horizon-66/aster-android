<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Aster 预览器</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shell.css">
<style>
 html,body{background:var(--bg)!important;height:100%;margin:0;overflow:hidden}
 .dragbar{position:fixed;left:0;top:0;right:0;height:30px;-webkit-app-region:drag;app-region:drag;z-index:50}
 .tabs{position:fixed;left:14px;right:14px;top:32px;height:34px;display:flex;gap:6px;align-items:center;overflow:hidden}
 .tab{height:30px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border:1px solid var(--line2);
   border-radius:9px 9px 0 0;font-size:12px;color:var(--ink2);cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden}
 .tab.on{color:var(--ink);border-bottom-color:#fff;background:#fff}
 .tab .x{color:var(--dim);cursor:pointer}
 .bar{position:fixed;left:14px;right:14px;top:70px;height:38px;display:flex;gap:8px;align-items:center;z-index:40}
 .navb{height:34px;width:34px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink2);cursor:pointer;
   display:inline-flex;align-items:center;justify-content:center}
 .bar input{flex:1;height:34px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:12.5px;outline:none}
 select{height:34px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 8px;font-size:12.5px}
 #go{height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12.5px;cursor:pointer}
 .hint{position:fixed;left:14px;right:14px;top:124px;bottom:64px;display:grid;place-items:center;color:var(--dim);font-size:12px;z-index:30;background:var(--bg)}
 #backHome{position:fixed;left:14px;bottom:16px;height:32px;padding:0 14px;border-radius:99px;background:var(--pink);
   color:#fff;font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
   box-shadow:0 8px 22px rgba(232,23,61,.35)}
</style></head><body>
<div class="dragbar"></div>
<div class="tabs" id="tabs"></div>
<div class="bar">
  <button class="navb" id="back"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="navb" id="fwd"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="navb" id="reload"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg></button>
  <input id="addr" placeholder="输入网址，或搜一个词">
  <select id="engineSel"><option value="baidu">百度</option><option value="sogou">搜狗</option><option value="bing">Bing</option><option value="so360">360</option></select>
  <button id="go">搜索</button>
  <button class="navb" id="bmBtn" title="收藏">☆</button>
  <button class="navb" id="bmList" title="收藏夹" style="width:auto;padding:0 10px;font-size:12px">收藏夹</button>
  <button class="navb" id="newtab" title="新页签">+</button>
</div>
<div class="hint" id="home">
  <div style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#e8173d" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.6 13.8 10 21 12l-7.2 2L12 21.4 10.2 14 3 12l7.2-2Z"/></svg>
      <span style="letter-spacing:.22em;font-size:14px;font-weight:600;color:var(--ink)">ASTER</span>
    </div>
    <div style="display:flex;gap:8px;width:min(520px,80vw)">
      <input id="homeQ" placeholder="搜一个词，或粘一个链接" style="flex:1;height:42px;border-radius:21px;border:1px solid var(--line2);padding:0 16px;font-size:14px;outline:none;background:#fff">
      <button id="homeGo" style="height:42px;padding:0 18px;border:0;border-radius:21px;background:var(--ink);color:var(--paper);font-size:13px;cursor:pointer">搜索</button>
    </div>
    <div style="font-size:11.5px;color:var(--dim)">用上面选中的引擎，默认百度</div>
  </div>
</div>
<a id="backHome" href="index.html">‹ Aster</a>
<script src="i18n.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ENG = {baidu:'https://www.baidu.com/s?wd=', sogou:'https://www.sogou.com/web?query=',
             bing:'https://www.bing.com/search?q=', so360:'https://www.so.com/s?q='};
const api = window.xingzi || {};
function target(q){ return /^https?:\/\//i.test(q) ? q : (ENG[localStorage.getItem('aster.engine')||'baidu']||ENG.baidu) + encodeURIComponent(q); }
let curUrl = '';
function nav(q){ if(!q) return; curUrl = target(q); api.previewNav && api.previewNav(curUrl); $('#addr').value = q; }
$('#go').onclick = () => nav($('#addr').value.trim());
const _hq = $('#homeQ'), _hg = $('#homeGo');
if (_hg) _hg.onclick = () => { const q = _hq.value.trim(); if (q) { $('#addr').value = q; nav(q); } };
if (_hq) _hq.addEventListener('keydown', (e) => { if (e.key === 'Enter') _hg.click(); });
$('#addr').addEventListener('keydown', (e)=>{ if(e.key==='Enter') $('#go').click(); });
const BMK = () => { try { return JSON.parse(localStorage.getItem('aster.bookmarks') || '[]'); } catch (e) { return []; } };
const saveBMK = (l) => localStorage.setItem('aster.bookmarks', JSON.stringify(l.slice(-40)));
const _bmBtn=$('#bmBtn'), _bmList=$('#bmList');
if (_bmBtn) _bmBtn.onclick = () => {
  const u = curUrl; if (!u) return;
  const l = BMK(); if (!l.some((x) => x.url === u)) { l.push({ url: u }); saveBMK(l); }
  $('#bmBtn').textContent = '★'; $('#bmBtn').style.color = 'var(--pink)';
};
if (_bmList) _bmList.onclick = () => {
  let box = document.getElementById('bmBox');
  if (box) { box.remove(); return; }
  const l = BMK();
  box = document.createElement('div');
  box.id = 'bmBox';
  box.style.cssText = 'position:fixed;right:14px;top:112px;z-index:60;background:#fff;border:1px solid #eae6de;' +
    'border-radius:12px;padding:8px;min-width:280px;max-height:46vh;overflow:auto;font-size:12px;box-shadow:0 18px 44px rgba(24,24,28,.12)';
  box.innerHTML = l.length ? l.slice().reverse().map((x) =>
    '<div style="display:flex;gap:8px;padding:6px 4px;border-top:1px solid #f4f1ec">' +
    '<a data-go="' + x.url + '" href="#" style="flex:1;color:#16171a;text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">' +
    x.url.replace(/^https?:\/\//, '').slice(0, 46) + '</a>' +
    '<span data-del="' + x.url + '" style="color:#9a9aa1;cursor:pointer">×</span></div>').join('')
    : '<div style="padding:10px;color:#9a9aa1">还没有收藏</div>';
  document.body.appendChild(box);
  box.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => {
    e.preventDefault(); api.previewNav && api.previewNav(a.dataset.go); curUrl = a.dataset.go; $('#addr').value = a.dataset.go; box.remove();
  });
  box.querySelectorAll('[data-del]').forEach((x) => x.onclick = () => {
    saveBMK(BMK().filter((y) => y.url !== x.dataset.del)); box.remove();
  });
};
$('#newtab').onclick = () => { api.previewNewTab && api.previewNewTab('https://www.baidu.com/'); };
$('#back').onclick = () => api.previewAct && api.previewAct('back');
$('#fwd').onclick = () => api.previewAct && api.previewAct('fwd');
$('#reload').onclick = () => api.previewAct && api.previewAct('reload');
$('#backHome').onclick = (e) => { if (window.opener) { e.preventDefault(); window.close(); } };
const sel = $('#engineSel');
sel.value = localStorage.getItem('aster.engine') || 'baidu';
sel.onchange = () => localStorage.setItem('aster.engine', sel.value);
if (api.onPreviewTabs) api.onPreviewTabs((tabs) => {
  const box = $('#tabs');
  box.innerHTML = tabs.map((t) => '<span class="tab ' + (t.active?'on':'') + '" data-id="' + t.id + '">' +
    (t.title || t.url || '新页签').slice(0, 22) + '<span class="x" data-close="' + t.id + '">×</span></span>').join('');
  box.querySelectorAll('.tab').forEach((el) => el.onclick = (ev) => {
    if (ev.target.dataset.close) { api.previewClose && api.previewClose(ev.target.dataset.close); return; }
    api.previewSwitch && api.previewSwitch(el.dataset.id);
  });
  const act = tabs.find((t) => t.active);
  const isHome = !act || !act.url || act.url === 'about:blank';
  if (act && act.url && !isHome) { $('#addr').value = act.url; curUrl = act.url; }
  if ($('#home')) $('#home').style.display = isHome ? 'grid' : 'none';
});
</script></body></html>
