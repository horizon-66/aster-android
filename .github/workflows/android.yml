name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "mobile-native/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装依赖并同步 Capacitor
        working-directory: mobile-native
        run: |
          npm ci || npm install
          npx cap sync android

      - name: 打 debug 包
        working-directory: mobile-native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: aster-android-debug
          path: mobile-native/android/app/build/outputs/apk/debug/*.apk
